name: release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get required Java version
        id: gradle-properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: gradle.properties
          properties: java_version mod_version

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.gradle-properties.outputs.java_version }}

      - name: Build artifacts
        run: ./gradlew clean build --no-daemon

      - name: Upload Fabric assets to GitHub, Modrinth, and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: ""
          files: |
            fabric/build/libs/!(*-@(dev|shadow|dev-shadow|sources|javadoc).jar)
          version: ${{ steps.gradle-properties.outputs.mod_version }}-fabric
          modrinth-id: emoji-type
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: emoji-type
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
          modrinth-unfeature-mode: none

      - name: Upload NeoForge assets to GitHub, Modrinth, and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: ""
          files: |
            neoforge/build/libs/!(*-@(dev|shadow|dev-shadow|sources|javadoc).jar)
          version: ${{ steps.gradle-properties.outputs.mod_version }}-neoforge
          modrinth-id: emoji-type
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: emoji-type
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
          modrinth-unfeature-mode: none
